<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A little sky for you 🌙</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap');

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  color:#fff;
  background:#01030b;
}
body:after{
  content:"";position:fixed;inset:-20%;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 25% 75%,rgba(78,115,255,.12),transparent 25%),
    radial-gradient(ellipse at 75% 65%,rgba(160,100,255,.10),transparent 23%),
    radial-gradient(ellipse at 50% 105%,rgba(255,165,90,.16),transparent 28%);
  animation:skyGlow 14s ease-in-out infinite alternate;
}
@keyframes skyGlow{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-1%,1%)}}
.sky{
  position:relative;width:100vw;height:100vh;overflow:hidden;
}
.sky:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 35%,rgba(80,120,255,.07),transparent 42%),
    linear-gradient(180deg,transparent 0 72%,rgba(5,10,28,.28));
}
.moon{
  position:absolute;left:50%;top:46%;
  width:118px;height:118px;border-radius:50%;
  transform:translate(-50%,-50%);
  animation:moonFloat 7s ease-in-out infinite;

  background:radial-gradient(circle at 35% 30%,#fff9df 0 12%,#f5dfae 55%,#d4b77f 100%);
  box-shadow:0 0 30px rgba(255,240,190,.5),0 0 75px rgba(255,240,190,.18);
}
.moon:before{
  content:"";position:absolute;inset:-30px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,235,180,.18),rgba(255,235,180,.06) 38%,transparent 70%);
  animation:moonHalo 4s ease-in-out infinite alternate;
}
.moon:after{
  content:"";position:absolute;inset:8px;border-radius:50%;
  background:
    radial-gradient(circle at 25% 60%,rgba(120,95,70,.13) 0 8%,transparent 9%),
    radial-gradient(circle at 67% 25%,rgba(120,95,70,.12) 0 7%,transparent 8%),
    radial-gradient(circle at 62% 70%,rgba(120,95,70,.10) 0 10%,transparent 11%);
}
.title{
  position:absolute;top:9%;left:50%;transform:translateX(-50%);
  width:90%;text-align:center;z-index:3;
}
.title h1{
  margin:0;font-size:clamp(34px,8vw,66px);font-weight:500;
  font-style:italic;letter-spacing:.4px;
  text-shadow:0 4px 28px rgba(150,180,255,.18);
}
.title p{
  margin:12px 0 0;font-family:"DM Sans",sans-serif;
  font-size:clamp(13px,3vw,17px);opacity:.72;letter-spacing:.7px;
}
.stars{position:absolute;inset:0}
.star{
  position:absolute;width:38px;height:38px;border:0;background:transparent;
  cursor:pointer;padding:0;z-index:5;
  transform:translate(-50%,-50%);
  border-radius:50%;
  transition:transform .25s ease,filter .25s ease;
}
.star:after{
  content:"";position:absolute;inset:4px;border-radius:50%;
  border:1px solid rgba(255,236,178,0);
  transition:.25s ease;
}
.star:hover{transform:translate(-50%,-50%) scale(1.25);filter:brightness(1.25)}
.star:hover:after{border-color:rgba(255,236,178,.38);box-shadow:0 0 18px rgba(255,220,130,.18)}

.star:before{
  content:"✦";display:block;color:#fff4c9;font-size:24px;
  text-shadow:0 0 7px #fff,0 0 18px rgba(255,220,130,.95);
  animation:twinkle 2.2s ease-in-out infinite;
}
.star.big:before{font-size:34px}
.star.seen{
  cursor:default;
  pointer-events:none;
  animation:none;
}
.star.seen:before{
  color:rgba(255,255,255,.42);
  font-size:13px;
  text-shadow:0 0 3px rgba(255,255,255,.35);
  animation:naturalStar 4.5s ease-in-out infinite;
}
.star.seen:after{
  border-color:transparent;
  box-shadow:none;
}
@keyframes naturalStar{
  0%,100%{opacity:.28;transform:scale(.82)}
  50%{opacity:.48;transform:scale(1)}
}
@keyframes twinkle{0%,100%{opacity:.45;transform:scale(.75) rotate(0deg)}50%{opacity:1;transform:scale(1.15) rotate(12deg)}}
@keyframes moonHalo{from{opacity:.55;transform:scale(.92)}to{opacity:1;transform:scale(1.08)}}
@keyframes moonFloat{
  0%,100%{transform:translate(-50%,-50%) translateY(0) scale(1)}
  50%{transform:translate(-50%,-50%) translateY(6px) scale(1.015)}
}


.instruction{
  position:absolute;bottom:10%;left:50%;transform:translateX(-50%);
  z-index:3;text-align:center;width:90%;font-size:15px;opacity:.72;
}
.count{margin-top:7px;font-size:13px;opacity:.6}

.message{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(1,5,15,.48);backdrop-filter:blur(5px);
  opacity:0;visibility:hidden;transition:.45s ease;z-index:20;
}
.message.show{opacity:1;visibility:visible}
.card{
  width:min(540px,88vw);padding:38px 30px;border-radius:28px;
  text-align:center;
  background:linear-gradient(145deg,rgba(19,29,61,.88),rgba(5,10,27,.9));
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 25px 90px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.06);
  transform:translateY(18px) scale(.97);transition:.45s ease;
}
.message.show .card{transform:translateY(0) scale(1)}
.card p{
  font-size:clamp(20px,5vw,28px);line-height:1.48;margin:0;
  font-weight:500;letter-spacing:.1px;
}
.close{
  margin-top:27px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07);
  color:white;border-radius:30px;padding:11px 22px;cursor:pointer;
  font-family:"DM Sans",sans-serif;font-size:13px;
  transition:.25s ease;
}
.close:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}


.reveal{
  position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:30px;
  background:radial-gradient(circle at center,rgba(20,30,65,.76),rgba(1,5,15,.95) 72%);
  opacity:0;visibility:hidden;transition:opacity 3.5s ease;
}
.reveal.show{opacity:1;visibility:visible}
.reveal-text{
  font-size:clamp(28px,7vw,54px);line-height:1.28;
  max-width:820px;font-style:italic;font-weight:500;
  letter-spacing:.2px;
  text-shadow:0 0 22px rgba(255,220,150,.42),0 0 65px rgba(130,150,255,.18);
}
.reveal-text span{display:inline-block}
.final{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:30px;
  background:linear-gradient(180deg,#102344 0%,#f2a56c 100%);
  opacity:0;visibility:hidden;transition:opacity 3.2s ease;
}
.final.show{opacity:1;visibility:visible}
.final-inner{transform:translateY(20px);transition:transform 3.2s ease}
.final.show .final-inner{transform:translateY(0)}
.final h2{font-size:clamp(30px,8vw,58px);font-weight:400;font-style:italic;margin:0 0 14px}
.final p{font-size:clamp(16px,4vw,22px);opacity:.9;margin:0}

@media(max-width:600px){
  .moon{width:88px;height:88px;left:50%;top:46%}
  .title{top:10%}
  .instruction{bottom:6%}
  .star{width:44px;height:44px}
}

.clouds{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.cloud{
  position:absolute;width:38vw;height:10vw;min-width:260px;
  border-radius:50%;filter:blur(14px);opacity:.10;
  background:#91a4cf;
}
.cloud.c1{top:22%;left:-25%;animation:cloudMove 38s linear infinite}
.cloud.c2{top:55%;left:75%;animation:cloudMove2 48s linear infinite}
.cloud.c3{top:72%;left:-30%;opacity:.07;animation:cloudMove 55s linear infinite}
@keyframes cloudMove{to{transform:translateX(155vw)}}
@keyframes cloudMove2{to{transform:translateX(-145vw)}}

.shooting{
  position:absolute;width:120px;height:2px;opacity:0;z-index:2;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff4ce,rgba(255,255,255,0));
  transform:rotate(-28deg);filter:drop-shadow(0 0 5px #fff);
}
.s1{top:25%;left:-15%;animation:shoot 8s 1s linear infinite}
.s2{top:40%;left:105%;animation:shootBack 11s 5s linear infinite}
@keyframes shoot{0%,82%{opacity:0;transform:translate(0,0) rotate(-28deg)}85%{opacity:1}100%{opacity:0;transform:translate(125vw,55vh) rotate(-28deg)}}
@keyframes shootBack{0%,82%{opacity:0;transform:translate(0,0) rotate(-28deg)}85%{opacity:1}100%{opacity:0;transform:translate(-125vw,48vh) rotate(-28deg)}}

.horizon{
  position:absolute;left:0;right:0;bottom:-2px;height:20%;
  background:linear-gradient(180deg,transparent,#030713 70%);
  clip-path:polygon(0 75%,8% 64%,17% 73%,26% 50%,35% 67%,44% 48%,53% 70%,62% 52%,72% 68%,82% 46%,91% 64%,100% 51%,100% 100%,0 100%);
  opacity:.8;z-index:2;pointer-events:none;
}

.bgstar{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#fff;opacity:.25;z-index:1;pointer-events:none;
  box-shadow:0 0 5px rgba(255,255,255,.7);
  animation:bgTwinkle ease-in-out infinite;
}
@keyframes bgTwinkle{
  0%,100%{opacity:.12;transform:scale(.7)}
  50%{opacity:.65;transform:scale(1.5)}
}

/* cinematic night layers */
.sky{
  background:
    radial-gradient(ellipse at 50% 20%,rgba(82,112,190,.16),transparent 42%),
    radial-gradient(ellipse at 20% 80%,rgba(82,70,170,.12),transparent 30%),
    linear-gradient(180deg,#01030b 0%,#03091a 48%,#07112a 100%);
}
.sky:after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 50% 65%,rgba(125,145,255,.07),transparent 28%),
    linear-gradient(180deg,transparent 60%,rgba(0,0,0,.38));
  animation:breath 9s ease-in-out infinite alternate;
}
@keyframes breath{from{opacity:.55}to{opacity:1}}

.nebula{
  position:absolute;inset:-25%;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 30% 45%,rgba(100,90,210,.07),transparent 25%),
    radial-gradient(ellipse at 70% 35%,rgba(60,130,220,.07),transparent 28%);
  filter:blur(35px);
  animation:nebula 28s ease-in-out infinite alternate;
}
@keyframes nebula{
  from{transform:translate(-2%,-1%) rotate(-2deg) scale(1)}
  to{transform:translate(3%,2%) rotate(2deg) scale(1.08)}
}

.milkyway{
  position:absolute;width:145vw;height:22vh;left:-22%;top:42%;
  transform:rotate(-17deg);pointer-events:none;z-index:1;
  background:linear-gradient(90deg,transparent,rgba(205,215,255,.07),rgba(255,255,255,.12),rgba(170,190,255,.05),transparent);
  filter:blur(18px);
  opacity:.5;
  animation:milky 18s ease-in-out infinite alternate;
}
@keyframes milky{from{transform:rotate(-17deg) translateX(-3%)}to{transform:rotate(-17deg) translateX(4%)}}

.instruction{
  bottom:7%;font-family:"DM Sans",sans-serif;
  letter-spacing:.3px;opacity:.9;
  animation:instructionPulse 3s ease-in-out infinite;
}
.instruction .hint{
  display:inline-flex;align-items:center;gap:9px;
  padding:11px 18px;border:1px solid rgba(255,255,255,.16);
  border-radius:999px;background:rgba(7,13,32,.45);
  box-shadow:0 8px 30px rgba(0,0,0,.2);
  backdrop-filter:blur(8px);
}
.instruction .hint:before{
  content:"✦";font-size:17px;color:#ffeab1;
  animation:hintStar 1.5s ease-in-out infinite;
}
@keyframes hintStar{50%{transform:scale(1.35);text-shadow:0 0 12px #ffeab1}}
@keyframes instructionPulse{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}

.count{
  margin-top:9px;font-family:"DM Sans",sans-serif;
  letter-spacing:.6px;
}

.burst{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:#fff1bd;z-index:15;pointer-events:none;
  box-shadow:0 0 10px #fff1bd,0 0 22px rgba(255,220,130,.7);
  animation:burst 1.3s ease-out forwards;
}
@keyframes burst{
  0%{opacity:0;transform:translate(0,0) scale(.3)}
  15%{opacity:1}
  100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.7)}
}

.constellation-ring{
  position:absolute;left:50%;top:46%;
  width:min(72vw,570px);height:min(72vw,570px);
  transform:translate(-50%,-50%) rotate(-8deg);
  border:1px solid rgba(180,200,255,.045);
  border-radius:50%;
  pointer-events:none;z-index:2;
  box-shadow:0 0 60px rgba(100,120,255,.035);
}
.constellation-ring:before,.constellation-ring:after{
  content:"";position:absolute;inset:10%;border-radius:50%;
  border:1px dashed rgba(255,230,175,.025);
}
</style>
</head>
<body>
<div class="sky" id="sky"><div class="nebula"></div><div class="milkyway"></div>
  <div class="moon"></div><div class="constellation-ring"></div>
  <div class="clouds"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
  <div class="shooting s1"></div><div class="shooting s2"></div><div class="horizon"></div>

  <div class="title">
    <h1>look up, Riya…</h1>
    <p>I left a few little things in the stars for you. ❤️</p>
  </div>

  <div class="stars" id="stars"></div>

  <div class="instruction" id="instruction">
    <div class="hint">click all the stars to open the messages</div>
    <div class="count" id="count">0 of 7 stars opened</div>
  </div>
</div>

<div class="message" id="message">
  <div class="card">
    <p id="messageText"></p>
    <button class="close" id="close">okayy ❤️</button>
  </div>
</div>

<div class="reveal" id="reveal">
  <div class="reveal-text">
    You’re my favourite little piece of <i>sunshine</i> in the night. 🌙☀️❤️
  </div>
</div>

<div class="final" id="final">
  <div class="final-inner">
    <h2>good morning, Riya. ☀️</h2>
    <p>hope you woke up with a smile today. ❤️</p>
  </div>
</div>

<script>
const messages = [
  "You make ordinary days feel a little less ordinary. ❤️",
  "I genuinely love the random little conversations we have. 😭",
  "You have no idea how often you make me smile without even trying. 🫶🏼",
  "If you ever forget how lovely you are… come back here, Riya. ❤️",
  "Somewhere under this same sky, there’s someone who’s really glad they know you. ☀️",
  "Okay this one is just here to remind you… smile. 😭❤️",
  "And yeah… I’m really glad I met you. ❤️"
];

// Seven message stars form a loose, natural constellation around the moon.
const positions = [
  [30,25],
  [50,22],
  [70,27],
  [79,46],
  [68,67],
  [50,73],
  [31,65]
];

const starsEl = document.getElementById("stars");
const msgEl = document.getElementById("message");
const msgText = document.getElementById("messageText");
const closeBtn = document.getElementById("close");
const countEl = document.getElementById("count");
const instruction = document.getElementById("instruction");
const reveal = document.getElementById("reveal");
const final = document.getElementById("final");

let opened = new Set();
let current = null;
let finished = false;

positions.forEach((pos,i)=>{
  const b=document.createElement("button");
  b.className="star"+([1,3,5].includes(i)?" big":"");
  b.style.left=pos[0]+"%";
  b.style.top=pos[1]+"%";
  b.style.animationDelay=(i*.23)+"s";
  b.setAttribute("aria-label","Open star "+(i+1));
  b.addEventListener("click",()=>openMessage(i,b));
  starsEl.appendChild(b);
});

function openMessage(i,b){
  if(finished) return;
  current=i;
  opened.add(i);
  msgText.textContent=messages[i];

  // Let the message appear first, then slowly turn that star into a faint,
  // ordinary-looking star instead of making it disappear completely.
  msgEl.classList.add("show");
  setTimeout(()=>{
    b.classList.add("seen");
  },520);
  countEl.textContent=`${opened.size} of ${messages.length} opened`;
}

function closeMessage(){
  msgEl.classList.remove("show");
  if(opened.size===messages.length && !finished){
    finished=true;
    setTimeout(startReveal,650);
  }
}

function startReveal(){
  // tiny celebration burst before the main line appears
  for(let i=0;i<18;i++){
    const spark=document.createElement("span");
    spark.className="burst";
    spark.style.left=(35+Math.random()*30)+"%";
    spark.style.top=(35+Math.random()*30)+"%";
    spark.style.setProperty("--x",(Math.random()*240-120)+"px");
    spark.style.setProperty("--y",(Math.random()*240-120)+"px");
    document.getElementById("sky").appendChild(spark);
    setTimeout(()=>spark.remove(),1500);
  }
  instruction.style.opacity="0";
  starsEl.style.transition="opacity 3s ease";
  starsEl.style.opacity="0";
  document.querySelector(".moon").style.transition="opacity 3s ease";
  document.querySelector(".moon").style.opacity="0.12";
  reveal.classList.add("show");

  // The revealed line stays briefly, then fades away by itself.
  setTimeout(()=>{
    reveal.classList.remove("show");
    setTimeout(()=>{
      final.classList.add("show");
    },3300);
  },5200);
}

closeBtn.addEventListener("click",closeMessage);
msgEl.addEventListener("click",(e)=>{
  if(e.target===msgEl) closeMessage();
});

// Extra background stars: tiny, slow-moving points that make the sky feel alive.
const sky = document.getElementById("sky");
for(let i=0;i<120;i++){
  const s=document.createElement("i");
  s.className="bgstar";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.animationDelay=(Math.random()*5)+"s";
  s.style.animationDuration=(2.5+Math.random()*4)+"s";
  sky.appendChild(s);
}
</script>
</body>
</html>
